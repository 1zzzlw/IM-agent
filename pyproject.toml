[project]
name = "lumina-agent"
version = "0.1.0"
description = "Lumina-Agent · 微光，个性化情感聊天 Agent 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0",
    "tzdata>=2025.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "chromadb>=1.5.9",
    "dbutils>=3.1.2",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-deepseek>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "nacos-sdk-python>=3.2.0",
    "openai>=3.11.0",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
]
